name: Build AetherX UI Native Library

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/src/main/jni/AetherX_UI/**'
      - 'app/src/main/jni/imgui/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build UI Library
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build native UI library
        shell: bash
        run: |
          set -euo pipefail

          UI_DIR="$GITHUB_WORKSPACE/app/src/main/jni/AetherX_UI"

          test -f "$UI_DIR/Android.mk"
          test -f "$UI_DIR/Application.mk"
          test -f "$UI_DIR/aether.cpp"

          mkdir -p "$RUNNER_TEMP/ndk-obj" "$RUNNER_TEMP/ndk-libs"

          "$ANDROID_NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH="$GITHUB_WORKSPACE" \
            APP_BUILD_SCRIPT="$UI_DIR/Android.mk" \
            NDK_APPLICATION_MK="$UI_DIR/Application.mk" \
            NDK_OUT="$RUNNER_TEMP/ndk-obj" \
            NDK_LIBS_OUT="$RUNNER_TEMP/ndk-libs" \
            APP_ABI=arm64-v8a

          find "$RUNNER_TEMP/ndk-libs" -type f -name '*.so' -print

          if ! find "$RUNNER_TEMP/ndk-libs" -type f -name '*.so' -print -quit | grep -q .; then
            echo "ERROR: No .so library was produced."
            exit 1
          fi

      - name: Upload .so files only
        uses: actions/upload-artifact@v4
        with:
          name: aetherx-ui-so-arm64-v8a
          path: ${{ runner.temp }}/ndk-libs/**/*.so
          if-no-files-found: error
          retention-days: 7
